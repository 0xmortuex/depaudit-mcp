[project]
name = "depaudit-mcp"
version = "0.1.0"
description = "MCP server that audits a project's dependencies for known vulnerabilities and outdated versions by reading lockfiles (uv, poetry, pip, npm, pnpm, yarn, Cargo, Go), transitive dependencies included."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "tomli>=2.0; python_version < '3.11'",
]
keywords = ["mcp", "security", "vulnerabilities", "osv", "lockfile", "dependencies", "audit", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio"]

[project.urls]
Homepage = "https://github.com/0xmortuex/depaudit-mcp"

[project.scripts]
depaudit-mcp = "depaudit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depaudit_mcp"]

[tool.pytest.ini_options]
markers = ["live: talks to the real OSV.dev / PyPI / npm / crates.io APIs (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
